# server
server:
  port: 8081
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  application:
    name: project-system
  # 数据库
  datasource:
    url: jdbc:mysql://localhost:3308/pxc-system-plus?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      # 空闲连接超时时间 10分钟
      idle-timeout: 600000
      # 最大连接生命周期 30分钟
      max-lifetime: 1800000
      # 连接超时时间 30秒
      connection-timeout: 30000
      pool-name: project-system-pool
  data:
    # Redis
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  # freemarker 路径
  #  freemarker:
  #    template-loader-path: classpath:/spring/templates/

  # 开启框架配置
  pxc-framework-boot3:
    #    dynamic:
    #      query-ds-sql: "SELECT db_code `name`, db_jdbc_url 'url', db_username 'username', db_password 'password' FROM database_source"
    # 是否开启异步
    async: true
    # 是否开启跨域
    cors:
      enabled: true
    # 开启 XSS 防护
    xss:
      enabled: false
    cache:
      type: redis
#    operatelog:
#      log-type: custom
#      handler: io.github.panxiaochao.system.infrastructure.common.event.OperateLogEventHandler

# mybatis-plus 配置
mybatis-plus:
  db-type: mysql
  sql-log-trace: true
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    # 开发测试时使用
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # jwt秘钥
  jwt-secret-key: pxc-system-cloud
  # 请求 token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） 默认2小时，-1 代表永久有效
  timeout: 7200
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: random-64
  # 是否输出操作日志
  is-log: false
  # 是否在初始化配置时打印版本字符画
  is-print: false
  # 是否尝试从header里读取token
  is-read-header: true
  # 是否尝试从cookie里读取token
  is-read-cookie: false
  # token前缀
  token-prefix: Bearer

# Sa-Token 扩展配置
sa-token-plus:
  # 白名单 URL
  white-urls:
    - /web/v1/**
    - /system/v1/**
    - /development/v1/**
